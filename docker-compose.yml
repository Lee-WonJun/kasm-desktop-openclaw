services:
  kasm-desktop:
    build:
      context: .
      dockerfile: kasm/dockerfile-kasm-desktop-openclaw
    environment:
      VNC_PW: ${VNC_PW}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
    ports:
      - "6901:6901"
    shm_size: "2gb"
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4g
    restart: unless-stopped
