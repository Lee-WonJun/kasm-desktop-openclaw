services:
  kasm-desktop:
    build:
      context: ./kasm
      dockerfile: dockerfile-kasm-desktop-openclaw
    environment:
      VNC_PW: ${VNC_PW}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      GROQ_API_KEY: ${GROQ_API_KEY}
      OPENCLAW_MODEL: ${OPENCLAW_MODEL:-groq/meta-llama/llama-4-scout-17b-16e-instruct}
    ports:
      - "6901:6901"
      - "18789:18789"
    volumes:
      - openclaw_data:/home/kasm-user/.openclaw
      - openclaw_workspace:/home/kasm-user/openclaw-workspace
    shm_size: "2gb"
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4g
    restart: unless-stopped

volumes:
  openclaw_data:
  openclaw_workspace:
